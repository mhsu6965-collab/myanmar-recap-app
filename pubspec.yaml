name: myanmar_recap_tool
description: Offline Video Recap Tool with Gemini, Edge TTS & FFmpegKit
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.4.0
  http: ^1.2.1
  web_socket_channel: ^3.0.1
  path_provider: ^2.1.3
  uuid: ^4.4.0
  ffmpeg_kit_flutter_new: ^4.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Pyidaungsu.ttf
